<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 字体目录 -->
  <dir>/app/fonts</dir>
  <dir prefix="cwd">./fonts</dir>

  <!-- 将 CSS 中的 sans-serif 默认指向 Source Han Sans SC -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>

  <!-- 将 serif 也指向 Source Han Sans SC（兜底） -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
</fontconfig>
